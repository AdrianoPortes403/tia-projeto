<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Trilha do aluno</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:3px solid #C9A227;outline-offset:2px}
</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;min-height:900px;background:#F4F1E6;color:#1F2A17;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">

  <aside style="flex:0 0 240px;box-sizing:border-box;background:#3B4A2A;color:#F4F1E6;padding:28px 16px;display:flex;flex-direction:column;gap:28px">
    <div style="display:flex;align-items:center;gap:12px;padding:0 8px">
      <div style="width:40px;height:40px;border-radius:12px;background:#A8B88A;color:#2A3720;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px">T</div>
      <div style="display:flex;flex-direction:column">
        <span style="font-weight:700;font-size:18px">TIA</span>
        <span style="font-size:12px;color:#D9DEC8">Trilha de aprendizagem</span>
      </div>
    </div>
    <nav aria-label="Principal" style="display:flex;flex-direction:column;gap:6px">
      <a href="Main.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#F4F1E6;font-size:15px;text-decoration:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Início
      </a>
      <a href="Trilha.dc.html" aria-current="page" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#F4F1E6;color:#2A3720;font-weight:700;font-size:15px;text-decoration:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h6"/></svg>
        Trilha
      </a>
      <a href="Estudar.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#F4F1E6;font-size:15px;text-decoration:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg>
        Estudar
      </a>
      <a href="Relatorio.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#F4F1E6;font-size:15px;text-decoration:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
        Meu relatório
      </a>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 8px;border-top:1px solid #5C7040">
      <div style="width:36px;height:36px;border-radius:50%;background:#A8B88A;color:#2A3720;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">AP</div>
      <div style="display:flex;flex-direction:column;flex-grow:1">
        <span style="font-size:14px;font-weight:600">Adriano</span>
        <a href="Entrar.dc.html" style="font-size:13px;color:#D9DEC8">Sair</a>
      </div>
    </div>
  </aside>

  <main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:36px 44px;display:flex;flex-direction:column;gap:24px">

    <header style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:6px">
        <h1 style="margin:0;font-size:34px;line-height:1.15;font-weight:800">Sua trilha</h1>
        <p style="margin:0;font-size:16px;color:#55604A">Siga na ordem. Cada etapa libera a próxima.</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;min-width:240px">
        <div role="progressbar" aria-valuenow="43" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso na trilha" style="flex-grow:1;height:12px;border-radius:999px;background:#FFFFFF">
          <div style="width:43%;height:12px;border-radius:999px;background:#5C7040"></div>
        </div>
        <span style="font-size:15px;font-weight:700;white-space:nowrap">3 de 7</span>
      </div>
    </header>

    <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column">
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
        <li style="display:flex;flex-direction:column">
          <sc-if value="{{ s.grupo }}" hint-placeholder-val="{{ false }}">
            <div style="padding:20px 0 12px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#55604A">{{ s.grupo }}</div>
          </sc-if>
          <div style="display:flex;gap:20px;align-items:stretch">
            <div style="flex:0 0 44px;display:flex;flex-direction:column;align-items:center">
              <div style="{{ s.circleStyle }}">
                <sc-if value="{{ s.feita }}" hint-placeholder-val="{{ false }}">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
                </sc-if>
                <sc-if value="{{ s.atual }}" hint-placeholder-val="{{ false }}">
                  <span>{{ s.numero }}</span>
                </sc-if>
                <sc-if value="{{ s.bloqueada }}" hint-placeholder-val="{{ false }}">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                </sc-if>
              </div>
              <sc-if value="{{ s.temLinha }}" hint-placeholder-val="{{ true }}">
                <div style="{{ s.lineStyle }}"></div>
              </sc-if>
            </div>
            <div style="{{ s.cardStyle }}">
              <div style="display:flex;flex-direction:column;gap:4px;flex:1 1 240px;min-width:0">
                <span style="font-size:18px;font-weight:700">{{ s.titulo }}</span>
                <span style="font-size:14px;color:#55604A">{{ s.detalhe }}</span>
              </div>
              <sc-if value="{{ s.atual }}" hint-placeholder-val="{{ false }}">
                <a href="Estudar.dc.html" style="display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;min-height:48px;box-sizing:border-box;border-radius:14px;background:#3B4A2A;color:#FFFFFF;font-size:16px;font-weight:700;text-decoration:none">Continuar</a>
              </sc-if>
              <sc-if value="{{ s.feita }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:14px;font-weight:700;color:#3B4A2A">Concluída</span>
              </sc-if>
              <sc-if value="{{ s.bloqueada }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:14px;color:#6B7260">Bloqueada</span>
              </sc-if>
            </div>
          </div>
        </li>
      </sc-for>
    </ol>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dados = [
      { titulo: 'Variáveis e tipos', detalhe: 'Guardar e nomear valores', estado: 'feita', grupo: 'Base comum' },
      { titulo: 'Condicionais', detalhe: 'Decidir com if e else', estado: 'feita' },
      { titulo: 'Repetição', detalhe: 'Repetir com for e while', estado: 'feita' },
      { titulo: 'Funções', detalhe: 'Reaproveitar código com parâmetros e retorno', estado: 'atual' },
      { titulo: 'Listas e strings', detalhe: 'Coleções e textos', estado: 'bloqueada' },
      { titulo: 'Complexidade de algoritmos', detalhe: 'Notação Big-O', estado: 'bloqueada', grupo: 'Trilha Dev' },
      { titulo: 'Estruturas lineares', detalhe: 'Pilhas, filas e listas ligadas', estado: 'bloqueada' }
    ];
    const base = 'width:44px;height:44px;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;';
    const steps = dados.map((d, i) => {
      const feita = d.estado === 'feita';
      const atual = d.estado === 'atual';
      const bloqueada = d.estado === 'bloqueada';
      const circleStyle = feita
        ? base + 'background:#5C7040;color:#FFFFFF;'
        : atual
        ? base + 'background:#C9A227;color:#2A3720;box-shadow:0 0 0 6px #F3E7B5;'
        : base + 'background:#F4F1E6;color:#6B7260;border:2px solid #A9AE9A;';
      const cardStyle = atual
        ? 'flex-grow:1;min-width:0;box-sizing:border-box;margin-bottom:20px;padding:20px 24px;border-radius:18px;background:#FFFFFF;border:2px solid #C9A227;display:flex;flex-wrap:wrap;gap:16px;align-items:center'
        : 'flex-grow:1;min-width:0;box-sizing:border-box;margin-bottom:20px;padding:20px 24px;border-radius:18px;background:' + (bloqueada ? '#ECE9DC' : '#FFFFFF') + ';display:flex;flex-wrap:wrap;gap:16px;align-items:center';
      return {
        titulo: d.titulo,
        detalhe: d.detalhe,
        grupo: d.grupo || '',
        numero: String(i + 1),
        feita, atual, bloqueada,
        temLinha: i < dados.length - 1,
        circleStyle,
        cardStyle,
        lineStyle: 'width:4px;flex-grow:1;min-height:24px;margin:4px 0;border-radius:2px;background:' + (feita ? '#5C7040' : '#CFCDBD')
      };
    });
    return { steps };
  }
}
</script>
</body>
</html>
