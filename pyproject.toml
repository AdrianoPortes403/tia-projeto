[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tia"
version = "0.1.0"
description = "Sistema TIA: tutoria inteligente com agentes de IA (Areté / IME)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "requests==2.32.3",
    "chromadb==0.5.23",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2"]

[tool.setuptools.packages.find]
where = ["src"]
