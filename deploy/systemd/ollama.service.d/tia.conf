# Ajuste do serviço do Ollama para o TIA (instalado por deploy/instalar.sh em
# /etc/systemd/system/ollama.service.d/tia.conf).
[Service]
# só na própria máquina: a API do Ollama não tem autenticação (nunca 0.0.0.0)
Environment=OLLAMA_HOST=127.0.0.1:11434
# Se o Ollama ficar em outra máquina da rede interna (GPU), troque pelo IP interno
# dela e libere a 11434 no firewall SÓ para o IP da VM do TIA.
#
# Download dos modelos (deploy/modelos.sh) por proxy de saída, se for o caso:
# Environment=HTTPS_PROXY=http://proxy.instituicao:3128
