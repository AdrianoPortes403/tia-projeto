# Proxy reverso HTTPS do TIA (nginx) - EXEMPLO para o Tiago ajustar (EAP 1.4.1).
# Copiar para /etc/nginx/sites-available/tia, ligar em sites-enabled, conferir
# com "nginx -t" e recarregar ("systemctl reload nginx").
#
# Troque: tia.exemplo.edu.br (domínio), os caminhos do certificado e, se o
# TIA não ficar na raiz do domínio, as rotas (ver docs/seguranca/implantacao.md
# sobre o EBAULA: mesmo site ou nova aba).
#
# O que este arquivo garante:
#   - só HTTPS (a porta 80 só redireciona); TLS 1.2+ ; HSTS
#   - cabeçalhos de segurança que a API não põe (HSTS) e cópia dos dela
#   - X-Forwarded-For/Proto para o uvicorn (--proxy-headers): o IP real chega aos limites
#   - limite de tamanho dos pedidos (o TIA não recebe arquivos) e de taxa no login
#   - log de acesso SEM o IP completo (LGPD): o IP fica só nos limites do TIA (30 dias)

# limite de taxa por IP no login (além do bloqueio por falhas do próprio TIA)
limit_req_zone $binary_remote_addr zone=tia_login:10m rate=10r/m;

# log sem o último octeto do IP (IPv4) e sem query string
map $remote_addr $ip_mascarado {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+    $ip.0;
    default                        "ipv6";
}
log_format tia_sem_ip '$ip_mascarado [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name tia.exemplo.edu.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tia.exemplo.edu.br;

    # --- TLS (certificado da instituição ou Let's Encrypt; o Let's Encrypt precisa de rede na renovação) ---
    ssl_certificate     /etc/ssl/certs/tia.exemplo.edu.br.crt;
    ssl_certificate_key /etc/ssl/private/tia.exemplo.edu.br.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TIA:10m;
    ssl_session_tickets off;

    # --- cabeçalhos ---
    # HSTS: só depois de o HTTPS estar estável (o navegador lembra por 1 ano)
    add_header Strict-Transport-Security "max-age=31536000" always;
    # a API já manda CSP, nosniff e Referrer-Policy; estes repetem para respostas do próprio nginx (erros)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;   # trocar se o EBAULA abrir o TIA em iframe do mesmo site
    server_tokens off;

    # --- tamanho e tempo ---
    client_max_body_size 64k;        # maior pedido do TIA: pergunta livre (até 2000 caracteres) em JSON
    client_body_timeout 15s;
    proxy_read_timeout 180s;         # o LLM em CPU pode demorar; o R09 é medido à parte (verificar.sh)

    access_log /var/log/nginx/tia-acesso.log tia_sem_ip;
    error_log  /var/log/nginx/tia-erro.log warn;

    location = /auth/login {
        limit_req zone=tia_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/tia-proxy.conf;
    }

    # documentação interativa: fechada em produção também aqui (a API já responde 404)
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/tia-proxy.conf;
    }
}

# Conteúdo de /etc/nginx/snippets/tia-proxy.conf (crie este arquivo):
#   proxy_set_header Host              $host;
#   proxy_set_header X-Forwarded-For   $remote_addr;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_http_version 1.1;
#   proxy_set_header Connection        "";
